name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NGINX_SERIES: "1.30"

jobs:
  versions:
    name: list nginx 1.30.x
    runs-on: ubuntu-22.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: List nginx ${{ env.NGINX_SERIES }}.x tarballs
        id: list
        env:
          SERIES: ${{ env.NGINX_SERIES }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          series = os.environ["SERIES"]
          url = "https://nginx.org/download/"
          try:
              html = urllib.request.urlopen(url, timeout=30).read().decode()
          except Exception as exc:
              print(f"failed to fetch {url}: {exc}", file=sys.stderr)
              sys.exit(1)

          versions = sorted(
              set(re.findall(rf"nginx-({re.escape(series)}\.\d+)\.tar\.gz", html)),
              key=lambda v: tuple(int(p) for p in v.split(".")),
          )
          if not versions:
              print(f"no nginx {series}.x tarballs on {url}", file=sys.stderr)
              sys.exit(1)

          print("found:", ", ".join(versions))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"versions={json.dumps(versions)}\n")
          PY

  build:
    name: nginx ${{ matrix.nginx }}
    needs: versions
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        nginx: ${{ fromJSON(needs.versions.outputs.versions) }}
    env:
      NGINX_VER: ${{ matrix.nginx }}
    steps:
      - uses: actions/checkout@v4

      - name: Build module + local nginx ${{ matrix.nginx }}
        run: |
          set -euo pipefail
          command -v gcc >/dev/null
          command -v make >/dev/null
          command -v curl >/dev/null

          src="$RUNNER_TEMP/nginx-$NGINX_VER"
          prefix="$RUNNER_TEMP/prefix"
          curl -fL --retry 3 --retry-delay 2 -o "$src.tar.gz" \
            "https://nginx.org/download/nginx-$NGINX_VER.tar.gz"
          tar -xf "$src.tar.gz" -C "$RUNNER_TEMP"
          cd "$src"

          cfg() {
            ./configure \
              --prefix="$prefix" \
              --with-compat \
              --add-dynamic-module="$GITHUB_WORKSPACE" \
              "$@"
          }

          if ! cfg; then
            echo "system pcre/zlib missing; fetching sources"
            deps="$RUNNER_TEMP/deps"
            mkdir -p "$deps"
            curl -fL --retry 3 -o "$deps/pcre2.tar.gz" \
              https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
            curl -fL --retry 3 -o "$deps/zlib.tar.gz" \
              https://zlib.net/zlib-1.3.1.tar.gz
            tar -xf "$deps/pcre2.tar.gz" -C "$deps"
            tar -xf "$deps/zlib.tar.gz" -C "$deps"
            cfg --with-pcre="$deps/pcre2-10.44" --with-zlib="$deps/zlib-1.3.1"
          fi

          make -j"$(nproc)"
          test -f objs/ngx_http_nwall_module.so
          test -x objs/nginx

      - name: Smoke test
        run: |
          set -euo pipefail

          src="$RUNNER_TEMP/nginx-$NGINX_VER"
          prefix="$RUNNER_TEMP/prefix"
          nginx="$src/objs/nginx"
          conf="$GITHUB_WORKSPACE/dev/nginx.conf"

          mkdir -p "$prefix"/{logs,html,modules}
          cp "$src/objs/ngx_http_nwall_module.so" \
            "$prefix/modules/ngx_http_nwall_module.so"
          printf 'ok\n' >"$prefix/html/index.html"

          "$nginx" -p "$prefix" -c "$conf" -t

          master=""
          cleanup() {
            if [[ -n "${master:-}" ]] && kill -0 "$master" 2>/dev/null; then
              kill -QUIT "$master" 2>/dev/null || kill -TERM "$master" 2>/dev/null || true
              wait "$master" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          "$nginx" -p "$prefix" -c "$conf" &
          master=$!

          ready=
          for _ in $(seq 1 50); do
            if ! kill -0 "$master" 2>/dev/null; then
              echo "nginx exited before becoming ready"
              wait "$master" || true
              exit 1
            fi
            if curl -fsS --max-time 1 http://127.0.0.1:18080/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          [[ -n "$ready" ]] || { echo "nginx did not become ready"; exit 1; }

          expect_body() {
            local want=$1
            shift
            local got
            got="$(curl -fsS --max-time 5 "$@")"
            [[ "$got" == "$want" ]]
          }

          expect_drop() {
            local rc=0
            shift
            curl -fsS --max-time 5 "$@" >/dev/null || rc=$?
            [[ $rc -ne 0 ]]
          }

          still_up() { kill -0 "$master" 2>/dev/null; }

          expect_body "ok"  http://127.0.0.1:18080/
          expect_body "ok"  -A "Mozilla/5.0" http://127.0.0.1:18080/
          expect_body "ok"  http://127.0.0.1:18080/secret.env
          expect_body "ok"  http://127.0.0.1:18080/.git/HEAD
          expect_body "off" http://127.0.0.1:18081/
          expect_body "off" -A sqlmap http://127.0.0.1:18081/
          expect_drop ua -A sqlmap http://127.0.0.1:18080/
          expect_drop empty -A "" http://127.0.0.1:18080/
          expect_drop env http://127.0.0.1:18080/.env
          expect_drop git http://127.0.0.1:18080/.git
          expect_drop wp http://127.0.0.1:18080/wp-admin.php
          still_up
          expect_body "ok" http://127.0.0.1:18080/

      - name: Stage module
        run: |
          mkdir -p artifact
          cp "$RUNNER_TEMP/nginx-$NGINX_VER/objs/ngx_http_nwall_module.so" \
            "artifact/ngx_http_nwall_module-$NGINX_VER.so"

      - uses: actions/upload-artifact@v4
        with:
          name: nwall-nginx-${{ matrix.nginx }}
          path: artifact/ngx_http_nwall_module-${{ matrix.nginx }}.so
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish
    needs: [versions, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: nwall-nginx-*
          merge-multiple: true
          path: artifacts

      - name: Package and publish
        env:
          EXPECTED: ${{ needs.versions.outputs.versions }}
          SERIES: ${{ env.NGINX_SERIES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, pathlib, sys

          expected = json.loads(os.environ["EXPECTED"])
          got = sorted(
              p.name[len("ngx_http_nwall_module-"):-len(".so")]
              for p in pathlib.Path("artifacts").glob("ngx_http_nwall_module-*.so")
          )
          if got != expected:
              print(f"artifact mismatch: got {got}, expected {expected}", file=sys.stderr)
              sys.exit(1)
          print("packaging:", ", ".join(got))
          PY

          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage/modules

          latest=""
          for so in $(printf '%s\n' artifacts/ngx_http_nwall_module-*.so | sort -V); do
            cp "$so" "dist/stage/modules/$(basename "$so")"
            latest=$so
          done
          cp "$latest" dist/stage/modules/ngx_http_nwall_module.so
          cp rules/nwall.rules dist/stage/nwall.rules

          tar -C dist/stage -czf \
            "dist/nwall-${VER}-nginx-${SERIES}-linux-x86_64.tar.gz" \
            modules nwall.rules

          for so in $(printf '%s\n' artifacts/ngx_http_nwall_module-*.so | sort -V); do
            nv=$(basename "$so" .so)
            nv=${nv#ngx_http_nwall_module-}
            dest="dist/v/${nv}"
            mkdir -p "$dest/modules"
            cp "$so" "$dest/modules/ngx_http_nwall_module.so"
            cp rules/nwall.rules "$dest/nwall.rules"
            tar -C "$dest" -czf \
              "dist/nwall-${VER}-nginx-${nv}-linux-x86_64.tar.gz" \
              modules nwall.rules
          done

          (cd dist && sha256sum nwall-*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
          tar -tzf "dist/nwall-${VER}-nginx-${SERIES}-linux-x86_64.tar.gz" | sort

          notes=$(cat <<EOF
          ## Install

          nginx only loads a dynamic module built for the **exact** same version (\`nginx -v\`). This release includes a build for every published **1.30.x**.

          Extract relative to \`/etc/nginx\`:

          \`\`\`bash
          sudo tar -xzf nwall-${VER}-nginx-1.30-linux-x86_64.tar.gz -C /etc/nginx
          \`\`\`

          That writes:

          \`\`\`
          /etc/nginx/nwall.rules
          /etc/nginx/modules/ngx_http_nwall_module.so            # latest 1.30.x
          /etc/nginx/modules/ngx_http_nwall_module-1.30.N.so     # pin if needed
          \`\`\`

          In the **main** context of \`nginx.conf\`:

          \`\`\`nginx
          load_module modules/ngx_http_nwall_module.so;
          # load_module modules/ngx_http_nwall_module-1.30.3.so;
          \`\`\`

          In \`http { }\`:

          \`\`\`nginx
          nwall_rules /etc/nginx/nwall.rules;
          \`\`\`

          In \`server { }\`:

          \`\`\`nginx
          nwall on;
          \`\`\`

          Per-version archives (\`nwall-${VER}-nginx-1.30.N-linux-x86_64.tar.gz\`) unpack to the same layout with only \`modules/ngx_http_nwall_module.so\`.
          EOF
          )

          gh release create "$GITHUB_REF_NAME" \
            dist/nwall-*.tar.gz dist/SHA256SUMS \
            --title "nwall ${VER}" \
            --generate-notes \
            --notes "$notes"