load_module modules/ngx_http_nwall_module.so;

worker_processes 1;
error_log        stderr info;
pid              logs/nginx.pid;
daemon           off;
master_process   on;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout combined;
    default_type text/plain;
    sendfile on;
    keepalive_timeout 15;

    nwall_rules ../rules/nwall.rules;

    server {
        listen 18080;
        server_name localhost;

        nwall on;
        root html;

        location / {
            return 200 "ok\n";
        }
    }

    server {
        listen 18081;
        server_name localhost;
        nwall off;

        location / {
            return 200 "off\n";
        }
    }
}